<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PicoHarp 300 PHD 轉 ASCII 表格工具</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }
    body {
      background-color: #f4f6f9;
      color: #333;
      padding: 40px 20px;
      display: flex;
      justify-content: center;
    }
    .container {
      width: 100%;
      max-width: 820px;
      background: #ffffff;
      padding: 32px;
      border-radius: 12px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.06);
    }
    h1 {
      font-size: 22px;
      font-weight: 700;
      color: #1a202c;
      margin-bottom: 6px;
    }
    p.subtitle {
      font-size: 13px;
      color: #718096;
      margin-bottom: 24px;
    }
    .drop-zone {
      border: 2px dashed #cbd5e0;
      border-radius: 8px;
      padding: 36px 20px;
      text-align: center;
      background: #f7fafc;
      cursor: pointer;
      transition: border-color 0.2s, background-color 0.2s;
    }
    .drop-zone:hover, .drop-zone.dragover {
      border-color: #3182ce;
      background-color: #ebf8ff;
    }
    .drop-zone p {
      font-size: 15px;
      color: #4a5568;
    }
    .drop-zone span {
      display: inline-block;
      margin-top: 8px;
      font-size: 13px;
      color: #a0aec0;
    }
    input[type="file"] {
      display: none;
    }
    .actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 20px;
      min-height: 40px;
    }
    .status-text {
      font-size: 14px;
      color: #4a5568;
      font-weight: 500;
    }
    .btn {
      background-color: #3182ce;
      color: #fff;
      border: none;
      padding: 9px 16px;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s;
      display: none;
    }
    .btn:hover {
      background-color: #2b6cb0;
    }
    .file-list {
      margin-top: 16px;
      max-height: 380px;
      overflow-y: auto;
      border-top: 1px solid #e2e8f0;
    }
    .file-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 8px;
      border-bottom: 1px solid #edf2f7;
      font-size: 13px;
    }
    .file-meta {
      display: flex;
      flex-direction: column;
      gap: 4px;
      max-width: 75%;
    }
    .file-name {
      font-weight: 600;
      color: #2d3748;
      word-break: break-all;
    }
    .file-info {
      font-size: 12px;
      color: #718096;
    }
    .badge-error {
      color: #e53e3e;
      font-weight: 600;
    }
    .download-single {
      color: #3182ce;
      text-decoration: none;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
    }
    .download-single:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

<div class="container">
  <h1>PicoHarp 300 (.phd) 轉 ASCII 數據表格</h1>
  <p class="subtitle">專門解析 PicoHarp 二進位檔案，自動生成 Time (ns) 與 Counts 數據表</p>

  <div class="drop-zone" id="dropZone">
    <p>拖曳多個 <strong>.phd</strong> 檔案至此，或點擊選取檔案</p>
    <span>支援批次轉檔，解析後可直接匯入 Origin 進行擬合</span>
    <input type="file" id="fileInput" multiple accept=".phd, .PHD">
  </div>

  <div class="actions">
    <div class="status-text" id="statusText">尚未選取任何檔案</div>
    <button class="btn" id="zipDownloadBtn">打包下載全部 (.zip)</button>
  </div>

  <div class="file-list" id="fileList"></div>
</div>

<script>
  const dropZone = document.getElementById('dropZone');
  const fileInput = document.getElementById('fileInput');
  const statusText = document.getElementById('statusText');
  const zipDownloadBtn = document.getElementById('zipDownloadBtn');
  const fileList = document.getElementById('fileList');

  let convertedFiles = [];

  dropZone.addEventListener('click', () => fileInput.click());

  dropZone.addEventListener('dragover', (e) => {
    e.preventDefault();
    dropZone.classList.add('dragover');
  });

  dropZone.addEventListener('dragleave', () => {
    dropZone.classList.remove('dragover');
  });

  dropZone.addEventListener('drop', (e) => {
    e.preventDefault();
    dropZone.classList.remove('dragover');
    if (e.dataTransfer.files.length > 0) {
      processFiles(e.dataTransfer.files);
    }
  });

  fileInput.addEventListener('change', (e) => {
    if (e.target.files.length > 0) {
      processFiles(e.target.files);
    }
  });

  function readFixedString(view, offset, length) {
    let str = '';
    for (let i = 0; i < length; i++) {
      const b = view.getUint8(offset + i);
      if (b === 0) break;
      str += String.fromCharCode(b);
    }
    return str.trim();
  }

  // 解析 PicoHarp 300 專用二進位結構 (v2.0)
  function parsePicoHarpPHD(buffer) {
    const view = new DataView(buffer);
    const magic = readFixedString(view, 0, 16);

    if (!magic.includes('PicoHarp 300')) {
      throw new Error(`非標準 PicoHarp 300 檔案格式 (Magic: ${magic})`);
    }

    const version = readFixedString(view, 16, 6);
    let channels = 65536;
    let resolutionPs = 4;
    let dataOffset = -1;

    // v2.0 標準二進位標頭結構偏移
    if (version.startsWith('2.')) {
      try {
        // PicoHarp 2.0 結構通常通道數與 Resolution 位於 Curve Header
        // 搜尋合適的直方圖資料起點 (一般在 2000~4000 bytes 之後)
        // 取得 Curve 解析度與 Channels
        // 標準 PicoHarp 2.0: Header 長度固定，曲線資料在最後 (Channels * 4 bytes)
        const fileBytes = buffer.byteLength;
        
        // 常見 Channels: 65536, 32768, 16384, 8192, 4096
        const testChannels = [65536, 32768, 16384, 8192, 4096, 2048, 1024];
        for (const ch of testChannels) {
          const expectedDataLen = ch * 4;
          const candidateOffset = fileBytes - expectedDataLen;
          if (candidateOffset > 500 && candidateOffset < 6000) {
            channels = ch;
            dataOffset = candidateOffset;
            break;
          }
        }

        // 嘗試讀取 Resolution (float/ps)
        // 典型 offset 在 curve header 內 (例如 dataOffset - 20 附近或固定偏移處)
        for (let offset = 800; offset < Math.min(dataOffset, 2500); offset += 4) {
          const val = view.getFloat32(offset, true);
          if (val >= 0.001 && val <= 1000.0 && [1, 2, 4, 8, 16, 32, 64, 128, 256, 512].some(step => Math.abs(val - step) < 0.01)) {
            resolutionPs = val;
            break;
          }
        }
      } catch (e) {
        // 回退預設
      }
    }

    if (dataOffset === -1) {
      // 容錯備案：預設倒推 65536 通道
      channels = Math.floor((buffer.byteLength - 2048) / 4);
      dataOffset = buffer.byteLength - (channels * 4);
    }

    const resolutionNs = resolutionPs / 1000.0;
    let output = `# PicoHarp 300 ASCII Export\n`;
    output += `# Resolution: ${resolutionPs} ps (${resolutionNs} ns)\n`;
    output += `# Channels: ${channels}\n`;
    output += `Time(ns)\tCounts\n`;

    for (let ch = 0; ch < channels; ch++) {
      const counts = view.getUint32(dataOffset + (ch * 4), true);
      const timeNs = (ch * resolutionNs).toFixed(5);
      output += `${timeNs}\t${counts}\n`;
    }

    return {
      text: output,
      info: `解析度: ${resolutionPs} ps, 點數: ${channels}`
    };
  }

  async function processFiles(files) {
    convertedFiles = [];
    fileList.innerHTML = '';

    const phdFiles = Array.from(files).filter(f => f.name.toLowerCase().endsWith('.phd'));

    if (phdFiles.length === 0) {
      statusText.textContent = '未選取 .phd 檔案。';
      zipDownloadBtn.style.display = 'none';
      return;
    }

    statusText.textContent = `解析中... (0/${phdFiles.length})`;
    zipDownloadBtn.style.display = 'none';

    for (let i = 0; i < phdFiles.length; i++) {
      const file = phdFiles[i];
      const newFileName = file.name.replace(/\.[^/.]+$/, "") + ".txt";

      try {
        const buffer = await file.arrayBuffer();
        const result = parsePicoHarpPHD(buffer);

        convertedFiles.push({
          name: newFileName,
          content: result.text
        });

        renderFileItem(newFileName, result.text, result.info, false);
      } catch (err) {
        renderFileItem(newFileName, '', `解析失敗: ${err.message}`, true);
      }

      statusText.textContent = `解析中... (${i + 1}/${phdFiles.length})`;
    }

    statusText.textContent = `完成！共轉換 ${convertedFiles.length} 個檔案。`;
    if (convertedFiles.length > 0) {
      zipDownloadBtn.style.display = 'inline-block';
    }
  }

  function renderFileItem(fileName, content, metaText, isError) {
    const item = document.createElement('div');
    item.className = 'file-item';

    const meta = document.createElement('div');
    meta.className = 'file-meta';

    const nameSpan = document.createElement('span');
    nameSpan.className = 'file-name';
    nameSpan.textContent = fileName;

    const infoSpan = document.createElement('span');
    infoSpan.className = `file-info ${isError ? 'badge-error' : ''}`;
    infoSpan.textContent = metaText;

    meta.appendChild(nameSpan);
    meta.appendChild(infoSpan);

    item.appendChild(meta);

    if (!isError) {
      const downloadLink = document.createElement('a');
      downloadLink.className = 'download-single';
      downloadLink.textContent = '下載 .txt';
      downloadLink.href = URL.createObjectURL(new Blob([content], { type: 'text/plain;charset=utf-8' }));
      downloadLink.download = fileName;
      item.appendChild(downloadLink);
    }

    fileList.appendChild(item);
  }

  zipDownloadBtn.addEventListener('click', async () => {
    if (convertedFiles.length === 0) return;

    zipDownloadBtn.disabled = true;
    zipDownloadBtn.textContent = '打包中...';

    try {
      const zip = new JSZip();
      convertedFiles.forEach(file => {
        zip.file(file.name, file.content);
      });

      const zipBlob = await zip.generateAsync({ type: 'blob' });
      const downloadUrl = URL.createObjectURL(zipBlob);
      const a = document.createElement('a');
      a.href = downloadUrl;
      a.download = `PicoHarp_ASCII_${new Date().toISOString().slice(0, 10)}.zip`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(downloadUrl);
    } catch (e) {
      alert('打包失敗：' + e.message);
    } finally {
      zipDownloadBtn.disabled = false;
      zipDownloadBtn.textContent = '打包下載全部 (.zip)';
    }
  });
</script>

</body>
</html>
