<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PicoHarp 300 (.phd) 轉純數據表格</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }
    body {
      background-color: #f0f2f5;
      color: #2d3748;
      padding: 30px 16px;
      display: flex;
      justify-content: center;
    }
    .container {
      width: 100%;
      max-width: 860px;
      background: #ffffff;
      padding: 32px;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
    }
    h1 {
      font-size: 22px;
      font-weight: 700;
      color: #1a202c;
      margin-bottom: 6px;
    }
    p.subtitle {
      font-size: 13px;
      color: #718096;
      margin-bottom: 24px;
    }
    .drop-zone {
      border: 2px dashed #cbd5e0;
      border-radius: 8px;
      padding: 36px 20px;
      text-align: center;
      background: #f8fafc;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .drop-zone:hover, .drop-zone.dragover {
      border-color: #3182ce;
      background-color: #ebf8ff;
    }
    .drop-zone p {
      font-size: 15px;
      font-weight: 600;
      color: #4a5568;
    }
    .drop-zone span {
      display: inline-block;
      margin-top: 8px;
      font-size: 13px;
      color: #a0aec0;
    }
    input[type="file"] {
      display: none;
    }
    .actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 20px;
      min-height: 42px;
    }
    .status-text {
      font-size: 14px;
      color: #4a5568;
      font-weight: 500;
    }
    .btn {
      background-color: #3182ce;
      color: #fff;
      border: none;
      padding: 10px 18px;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s;
      display: none;
    }
    .btn:hover {
      background-color: #2b6cb0;
    }
    .file-list {
      margin-top: 18px;
      max-height: 480px;
      overflow-y: auto;
      border-top: 1px solid #e2e8f0;
    }
    .file-item {
      padding: 14px 10px;
      border-bottom: 1px solid #edf2f7;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .file-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .file-name {
      font-weight: 600;
      color: #1a202c;
      word-break: break-all;
    }
    .file-actions {
      display: flex;
      gap: 12px;
      align-items: center;
    }
    .preview-toggle {
      color: #4a5568;
      font-size: 12px;
      text-decoration: underline;
      cursor: pointer;
    }
    .download-link {
      color: #3182ce;
      text-decoration: none;
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
    }
    .download-link:hover {
      text-decoration: underline;
    }
    .file-details {
      font-size: 12px;
      color: #718096;
      line-height: 1.5;
    }
    .file-preview {
      display: none;
      background: #1e1e1e;
      color: #d4d4d4;
      font-family: monospace;
      font-size: 11px;
      padding: 10px;
      border-radius: 6px;
      max-height: 140px;
      overflow-y: auto;
      white-space: pre;
    }
    .badge-error {
      color: #e53e3e;
      font-weight: 600;
    }
  </style>
</head>
<body>

<div class="container">
  <h1>PicoHarp 300 (.phd) 轉純數據表格</h1>
  <p class="subtitle">僅保留雙欄數值（Time[ns] 與 Counts），不含任何表頭文字</p>

  <div class="drop-zone" id="dropZone">
    <p>拖曳多個 <strong>.phd</strong> 檔案至此，或點擊選取檔案</p>
    <span>瀏覽器本機端批次解析，直接輸出兩欄純數值格式</span>
    <input type="file" id="fileInput" multiple accept=".phd, .PHD">
  </div>

  <div class="actions">
    <div class="status-text" id="statusText">尚未選取任何檔案</div>
    <button class="btn" id="zipDownloadBtn">打包下載全部 (.zip)</button>
  </div>

  <div class="file-list" id="fileList"></div>
</div>

<script>
  const dropZone = document.getElementById('dropZone');
  const fileInput = document.getElementById('fileInput');
  const statusText = document.getElementById('statusText');
  const zipDownloadBtn = document.getElementById('zipDownloadBtn');
  const fileList = document.getElementById('fileList');

  let outputArchives = [];

  dropZone.addEventListener('click', () => fileInput.click());
  dropZone.addEventListener('dragover', (e) => { e.preventDefault(); dropZone.classList.add('dragover'); });
  dropZone.addEventListener('dragleave', () => { dropZone.classList.remove('dragover'); });
  dropZone.addEventListener('drop', (e) => {
    e.preventDefault();
    dropZone.classList.remove('dragover');
    if (e.dataTransfer.files.length > 0) processFiles(e.dataTransfer.files);
  });
  fileInput.addEventListener('change', (e) => {
    if (e.target.files.length > 0) processFiles(e.target.files);
  });

  function readAscii(view, offset, length) {
    let str = '';
    for (let i = 0; i < length; i++) {
      const b = view.getUint8(offset + i);
      if (b === 0) break;
      str += String.fromCharCode(b);
    }
    return str.trim();
  }

  function parsePicoHarpFile(buffer) {
    const view = new DataView(buffer);
    let offset = 0;

    const ident = readAscii(view, offset, 16); offset += 16;
    if (!ident.includes('PicoHarp 300')) {
      throw new Error(`非標準 PicoHarp 300 格式 (Ident: ${ident})`);
    }

    const formatVersion = readAscii(view, offset, 6); offset += 6;
    const creatorName = readAscii(view, offset, 18); offset += 18;
    const creatorVersion = readAscii(view, offset, 12); offset += 12;
    const fileTime = readAscii(view, offset, 18); offset += 18;
    offset += 2;   // crlf
    offset += 256; // comment

    const numberOfCurves = view.getInt32(offset, true); offset += 4;
    const bitsPerHistoBin = view.getInt32(offset, true); offset += 4;
    const routingChannels = view.getInt32(offset, true); offset += 4;
    offset += (4 * 15); // other header settings

    // Display Curves (8 * 4 * 3)
    offset += (8 * 4 * 3);

    // Cursors (3 * 4 * 3)
    offset += (3 * 4 * 3);

    // Board Specific Header
    offset += 10; // hwSerial
    offset += 8;  // hwPartNo
    offset += (4 * 12); // board settings

    // Router structure
    if (routingChannels > 1) {
      offset += (routingChannels * (4 + 4 + 4 + 4));
    }

    const curves = [];

    for (let c = 0; c < Math.max(1, numberOfCurves); c++) {
      if (offset >= buffer.byteLength) break;

      offset += 4; // curveIndex
      offset += 4; // timeOfRec
      offset += 10; // chHwSerial
      offset += 8;  // chHwPartNo
      offset += (4 * 3); // chHwVersion, chHwIndex, chInput
      
      const chResolution = view.getFloat32(offset, true); offset += 4;
      offset += (4 * 12); // rates, levels, sync settings, router

      const chChannels = view.getInt32(offset, true); offset += 4;
      offset += 4; // chRangeNo

      let actualResPs = (chResolution > 0 && chResolution < 10000) ? chResolution : 4.0;
      let actualChannels = (chChannels > 0 && chChannels <= 65536) ? chChannels : 65536;

      const resolutionNs = actualResPs / 1000.0;
      let pureData = '';

      for (let i = 0; i < actualChannels; i++) {
        if (offset + 4 <= buffer.byteLength) {
          const counts = view.getUint32(offset, true);
          offset += 4;
          const t = (i * resolutionNs).toFixed(5);
          pureData += `${t}\t${counts}\n`;
        } else {
          break;
        }
      }

      curves.push({
        curveIndex: c,
        resolutionPs: actualResPs,
        channels: actualChannels,
        text: pureData
      });
    }

    return {
      fileTime,
      numberOfCurves: Math.max(1, numberOfCurves),
      curves
    };
  }

  async function processFiles(files) {
    outputArchives = [];
    fileList.innerHTML = '';

    const validFiles = Array.from(files).filter(f => f.name.toLowerCase().endsWith('.phd'));

    if (validFiles.length === 0) {
      statusText.textContent = '未檢測到 .phd 檔案，請重新選取。';
      zipDownloadBtn.style.display = 'none';
      return;
    }

    statusText.textContent = `解析中... (0/${validFiles.length})`;
    zipDownloadBtn.style.display = 'none';

    for (let i = 0; i < validFiles.length; i++) {
      const file = validFiles[i];
      const baseName = file.name.replace(/\.[^/.]+$/, "");

      try {
        const buffer = await file.arrayBuffer();
        const parsed = parsePicoHarpFile(buffer);

        parsed.curves.forEach((curve, idx) => {
          const exportName = parsed.curves.length > 1 
            ? `${baseName}_c${idx}.txt` 
            : `${baseName}.txt`;

          outputArchives.push({
            name: exportName,
            content: curve.text
          });

          renderFileItem(
            exportName,
            curve.text,
            `解析度: ${curve.resolutionPs} ps | 資料點數: ${curve.channels}`,
            false
          );
        });

      } catch (err) {
        renderFileItem(file.name, '', `解析失敗: ${err.message}`, true);
      }

      statusText.textContent = `解析中... (${i + 1}/${validFiles.length})`;
    }

    statusText.textContent = `完成！共轉換 ${outputArchives.length} 條純數據曲線。`;
    if (outputArchives.length > 0) {
      zipDownloadBtn.style.display = 'inline-block';
    }
  }

  function renderFileItem(fileName, content, metaInfo, isError) {
    const item = document.createElement('div');
    item.className = 'file-item';

    const header = document.createElement('div');
    header.className = 'file-header';

    const nameSpan = document.createElement('span');
    nameSpan.className = 'file-name';
    nameSpan.textContent = fileName;

    const actionsDiv = document.createElement('div');
    actionsDiv.className = 'file-actions';

    if (!isError) {
      const toggleBtn = document.createElement('span');
      toggleBtn.className = 'preview-toggle';
      toggleBtn.textContent = '預覽數據';

      const downloadLink = document.createElement('a');
      downloadLink.className = 'download-link';
      downloadLink.textContent = '下載 .txt';
      downloadLink.href = URL.createObjectURL(new Blob([content], { type: 'text/plain;charset=utf-8' }));
      downloadLink.download = fileName;

      actionsDiv.appendChild(toggleBtn);
      actionsDiv.appendChild(downloadLink);

      header.appendChild(nameSpan);
      header.appendChild(actionsDiv);
      item.appendChild(header);

      const details = document.createElement('div');
      details.className = 'file-details';
      details.textContent = metaInfo;
      item.appendChild(details);

      // 預覽前 15 行純數據
      const preview = document.createElement('div');
      preview.className = 'file-preview';
      preview.textContent = content.split('\n').slice(0, 16).join('\n') + '\n... (其餘數據省略)';
      item.appendChild(preview);

      toggleBtn.addEventListener('click', () => {
        const isShown = preview.style.display === 'block';
        preview.style.display = isShown ? 'none' : 'block';
        toggleBtn.textContent = isShown ? '預覽數據' : '收起預覽';
      });

    } else {
      header.appendChild(nameSpan);
      item.appendChild(header);

      const errorDetails = document.createElement('div');
      errorDetails.className = 'file-details badge-error';
      errorDetails.textContent = metaInfo;
      item.appendChild(errorDetails);
    }

    fileList.appendChild(item);
  }

  zipDownloadBtn.addEventListener('click', async () => {
    if (outputArchives.length === 0) return;

    zipDownloadBtn.disabled = true;
    zipDownloadBtn.textContent = '打包中...';

    try {
      const zip = new JSZip();
      outputArchives.forEach(f => {
        zip.file(f.name, f.content);
      });

      const zipBlob = await zip.generateAsync({ type: 'blob' });
      const downloadUrl = URL.createObjectURL(zipBlob);
      const a = document.createElement('a');
      a.href = downloadUrl;
      a.download = `PicoHarp_Data_${new Date().toISOString().slice(0, 10)}.zip`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(downloadUrl);
    } catch (e) {
      alert('打包失敗：' + e.message);
    } finally {
      zipDownloadBtn.disabled = false;
      zipDownloadBtn.textContent = '打包下載全部 (.zip)';
    }
  });
</script>

</body>
</html>
