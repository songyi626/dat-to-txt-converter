<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PHD 轉 TXT 批次轉換工具</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }
    body {
      background-color: #f4f6f9;
      color: #333;
      padding: 40px 20px;
      display: flex;
      justify-content: center;
    }
    .container {
      width: 100%;
      max-width: 760px;
      background: #ffffff;
      padding: 32px;
      border-radius: 12px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.06);
    }
    h1 {
      font-size: 24px;
      font-weight: 700;
      color: #1a202c;
      margin-bottom: 8px;
    }
    p.subtitle {
      font-size: 14px;
      color: #718096;
      margin-bottom: 24px;
    }
    .drop-zone {
      border: 2px dashed #cbd5e0;
      border-radius: 8px;
      padding: 40px 20px;
      text-align: center;
      background: #f7fafc;
      cursor: pointer;
      transition: border-color 0.2s, background-color 0.2s;
    }
    .drop-zone:hover, .drop-zone.dragover {
      border-color: #3182ce;
      background-color: #ebf8ff;
    }
    .drop-zone p {
      font-size: 15px;
      color: #4a5568;
    }
    .drop-zone span {
      display: inline-block;
      margin-top: 8px;
      font-size: 13px;
      color: #a0aec0;
    }
    input[type="file"] {
      display: none;
    }
    .actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 24px;
      min-height: 40px;
    }
    .status-text {
      font-size: 14px;
      color: #4a5568;
      font-weight: 500;
    }
    .btn {
      background-color: #3182ce;
      color: #fff;
      border: none;
      padding: 10px 18px;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s;
      display: none;
    }
    .btn:hover {
      background-color: #2b6cb0;
    }
    .btn:disabled {
      background-color: #a0aec0;
      cursor: not-allowed;
    }
    .file-list {
      margin-top: 20px;
      max-height: 360px;
      overflow-y: auto;
      border-top: 1px solid #e2e8f0;
    }
    .file-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 8px;
      border-bottom: 1px solid #edf2f7;
      font-size: 14px;
    }
    .file-name {
      font-weight: 500;
      color: #2d3748;
      word-break: break-all;
      margin-right: 12px;
    }
    .download-single {
      color: #3182ce;
      text-decoration: none;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
    }
    .download-single:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

<div class="container">
  <h1>.PHD 轉 .TXT 批次轉換工具</h1>
  <p class="subtitle">在瀏覽器本機端直接解析與格式轉換，不經伺服器傳輸</p>

  <div class="drop-zone" id="dropZone">
    <p>拖曳多個 <strong>.phd</strong> 檔案至此，或點擊選取檔案</p>
    <span>支援多選檔案與自動編碼相容</span>
    <input type="file" id="fileInput" multiple accept=".phd">
  </div>

  <div class="actions">
    <div class="status-text" id="statusText">尚未選取任何檔案</div>
    <button class="btn" id="zipDownloadBtn">打包下載全部 (.zip)</button>
  </div>

  <div class="file-list" id="fileList"></div>
</div>

<script>
  const dropZone = document.getElementById('dropZone');
  const fileInput = document.getElementById('fileInput');
  const statusText = document.getElementById('statusText');
  const zipDownloadBtn = document.getElementById('zipDownloadBtn');
  const fileList = document.getElementById('fileList');

  let convertedFiles = [];

  dropZone.addEventListener('click', () => fileInput.click());

  dropZone.addEventListener('dragover', (e) => {
    e.preventDefault();
    dropZone.classList.add('dragover');
  });

  dropZone.addEventListener('dragleave', () => {
    dropZone.classList.remove('dragover');
  });

  dropZone.addEventListener('drop', (e) => {
    e.preventDefault();
    dropZone.classList.remove('dragover');
    if (e.dataTransfer.files.length > 0) {
      handleFiles(e.dataTransfer.files);
    }
  });

  fileInput.addEventListener('change', (e) => {
    if (e.target.files.length > 0) {
      handleFiles(e.target.files);
    }
  });

  // 解碼邏輯：優先嘗試 UTF-8，若有替換字元 (U+FFFD) 則回退至 Big-5 / ANSI
  async function readTextWithFallback(file) {
    const buffer = await file.arrayBuffer();
    try {
      const utf8Decoder = new TextDecoder('utf-8', { fatal: true });
      return utf8Decoder.decode(buffer);
    } catch {
      try {
        const big5Decoder = new TextDecoder('big5');
        return big5Decoder.decode(buffer);
      } catch {
        const fallbackDecoder = new TextDecoder('windows-1252');
        return fallbackDecoder.decode(buffer);
      }
    }
  }

  async function handleFiles(files) {
    convertedFiles = [];
    fileList.innerHTML = '';
    const validFiles = Array.from(files).filter(f => f.name.toLowerCase().endsWith('.phd'));

    if (validFiles.length === 0) {
      statusText.textContent = '未檢測到副檔名為 .phd 的檔案。';
      zipDownloadBtn.style.display = 'none';
      return;
    }

    statusText.textContent = `處理中... (0/${validFiles.length})`;
    zipDownloadBtn.style.display = 'none';

    for (let i = 0; i < validFiles.length; i++) {
      const file = validFiles[i];
      const textContent = await readTextWithFallback(file);
      const newFileName = file.name.replace(/\.[^/.]+$/, "") + ".txt";

      convertedFiles.push({
        name: newFileName,
        content: textContent
      });

      renderFileItem(newFileName, textContent);
      statusText.textContent = `處理中... (${i + 1}/${validFiles.length})`;
    }

    statusText.textContent = `完成！共轉換 ${convertedFiles.length} 個檔案。`;
    zipDownloadBtn.style.display = 'inline-block';
  }

  function renderFileItem(fileName, content) {
    const item = document.createElement('div');
    item.className = 'file-item';

    const nameSpan = document.createElement('span');
    nameSpan.className = 'file-name';
    nameSpan.textContent = fileName;

    const downloadLink = document.createElement('a');
    downloadLink.className = 'download-single';
    downloadLink.textContent = '下載 .txt';
    downloadLink.href = URL.createObjectURL(new Blob([content], { type: 'text/plain;charset=utf-8' }));
    downloadLink.download = fileName;

    item.appendChild(nameSpan);
    item.appendChild(downloadLink);
    fileList.appendChild(item);
  }

  zipDownloadBtn.addEventListener('click', async () => {
    if (convertedFiles.length === 0) return;

    zipDownloadBtn.disabled = true;
    zipDownloadBtn.textContent = '打包中...';

    const zip = new JSZip();
    convertedFiles.forEach(file => {
      zip.file(file.name, file.content);
    });

    const zipBlob = await zip.generateAsync({ type: 'blob' });
    const downloadUrl = URL.createObjectURL(zipBlob);
    const a = document.createElement('a');
    a.href = downloadUrl;
    a.download = `phd_converted_${new Date().toISOString().slice(0, 10)}.zip`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(downloadUrl);

    zipDownloadBtn.disabled = false;
    zipDownloadBtn.textContent = '打包下載全部 (.zip)';
  });
</script>

</body>
</html>
